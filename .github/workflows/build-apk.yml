name: Build FlashChat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Prepare web assets for Capacitor
        run: |
          # Ensure webDir exists and contains the app's web files (capacitor.config.json expects "www")
          mkdir -p www
          # Copy repo web files into www; exclude build/system files and android output if present
          rsync -av --exclude 'android' --exclude 'node_modules' --exclude '.git' --exclude '.github' --exclude '*.zip' ./ www/
          ls -la www

      - name: Install Capacitor Android dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android project (only if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ exists, skipping cap add"
          fi

      - name: Sync web assets with Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashChat-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
