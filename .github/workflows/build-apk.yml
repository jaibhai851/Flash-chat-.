name: Build FlashChat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 33
          build-tools: '33.0.2'

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor Android dependencies
        run: npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android

      - name: Ensure android project exists
        run: |
          if [ ! -d android ]; then
            echo "Adding Android project via Capacitor"
            npx cap add android
          else
            echo "android/ already exists, skipping cap add"
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Pci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashChat-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
