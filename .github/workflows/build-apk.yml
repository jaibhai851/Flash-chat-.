name: Build FlashChat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/opt/android-sdk' }}
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="/opt/android-sdk"
          fi

          mkdir -p "$SDK_ROOT"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT/cmdline-tools"

            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O tools.zip
            unzip -q tools.zip
            rm -f tools.zip

            if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
              mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            fi
          fi

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install project dependencies
        run: npm install

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          rsync -av --exclude 'android' --exclude 'node_modules' --exclude '.git' --exclude '.github' --exclude '*.zip' ./ www/
          ls -la www

      - name: Install Capacitor Android dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android project (only if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ exists, skipping cap add"
          fi

      - name: Sync web assets with Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashChat-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
